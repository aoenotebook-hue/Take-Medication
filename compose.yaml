services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: medication
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: medication
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["medication-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medication"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  medication-db:
